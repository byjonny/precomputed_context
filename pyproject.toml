[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precomputed-context"
version = "0.1.0"
description = "Reasoning experiments for precomputed context, structured hints, and thinking exemplars."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

